name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(find cmd internal migrations -name '*.go'))"
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Build
        run: go build ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: securewallet_wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d securewallet_wallet"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: ACID transfer integration test
        env:
          TEST_WALLET_DATABASE_URL: postgres://postgres:postgres@localhost:5432/securewallet_wallet?sslmode=disable
        run: go test -tags=integration -count=1 -v ./internal/wallet/repository

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t securewallet:ci .
